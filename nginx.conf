# EasyStay Nginx 配置文件
# 将此文件复制到 /etc/nginx/sites-available/easystay 并启用

server {
    listen 80;
    server_name 81.71.15.150;

    # 管理端 - 根路径
    location / {
        root /opt/EasyStay_Project/admin-pc/build;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 移动端 - /mobile 路径
    location /mobile/ {
        alias /opt/EasyStay_Project/client-mobile/build/;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
    }

    # 后端 API 代理
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # 日志配置
    access_log /var/log/nginx/easystay_access.log;
    error_log /var/log/nginx/easystay_error.log;
}
