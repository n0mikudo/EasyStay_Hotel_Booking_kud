# EasyStay Nginx 配置文件 - HTTPS
# 域名: easystay4u.site

# HTTP -> HTTPS 重定向（域名访问）
server {
    listen 80;
    server_name easystay4u.site www.easystay4u.site;
    return 301 https://easystay4u.site$request_uri;
}

# IP 直连走 HTTP（保留兼容性）
server {
    listen 80 default_server;
    server_name _;

    location / {
        root /opt/EasyStay_Project/admin-pc/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location = /mobile {
        return 301 /mobile/;
    }

    location /mobile/ {
        alias /opt/EasyStay_Project/client-mobile/build/;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /api/chat {
        proxy_pass http://localhost:3000/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        root /opt/EasyStay_Project/admin-pc/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /mobile/static/ {
        alias /opt/EasyStay_Project/client-mobile/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name easystay4u.site;

    ssl_certificate /etc/letsencrypt/live/easystay4u.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easystay4u.site/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /opt/EasyStay_Project/admin-pc/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location = /mobile {
        return 301 /mobile/;
    }

    location /mobile/ {
        alias /opt/EasyStay_Project/client-mobile/build/;
        index index.html;
        try_files $uri $uri/ /mobile/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    location /api/chat {
        proxy_pass http://localhost:3000/api/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        root /opt/EasyStay_Project/admin-pc/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /mobile/static/ {
        alias /opt/EasyStay_Project/client-mobile/build/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript application/xml;

    access_log /var/log/nginx/easystay_access.log;
    error_log /var/log/nginx/easystay_error.log;
}
