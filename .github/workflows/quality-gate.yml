name: Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

env:
  NPM_CONFIG_PRODUCTION: "false"
  NPM_CONFIG_OMIT: "optional"

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-mobile/package-lock.json

      - name: Install mobile deps
        run: npm ci --include=dev --prefix client-mobile
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_OMIT: "optional"

      - name: Build mobile
        run: CI= npm run build --prefix client-mobile

  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-pc/package-lock.json

      - name: Install admin deps
        run: npm ci --include=dev --prefix admin-pc
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_OMIT: "optional"

      - name: Typecheck admin
        run: npm run typecheck --prefix admin-pc

      - name: Build admin
        run: CI= npm run build --prefix admin-pc
