name: Quality Gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client-mobile/package-lock.json

      - name: Pin npm version (mobile)
        run: |
          npm install -g npm@10
          npm --version

      - name: Diagnose npm config (mobile)
        working-directory: client-mobile
        run: |
          npm --version
          node --version
          npm config get production
          npm config get omit
          npm config get include
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

      - name: Install mobile deps
        working-directory: client-mobile
        run: |
          npm ci --include=dev --prefer-online --no-audit --no-fund || (echo "Retry npm ci for mobile..." && npm cache verify && npm ci --include=dev --prefer-online --no-audit --no-fund)
          npm ls react-scripts --depth=0
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

      - name: Build mobile
        working-directory: client-mobile
        run: CI= npm run build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

  admin-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-pc/package-lock.json

      - name: Pin npm version (admin)
        run: |
          npm install -g npm@10
          npm --version

      - name: Diagnose npm config (admin)
        working-directory: admin-pc
        run: |
          npm --version
          node --version
          npm config get production
          npm config get omit
          npm config get include
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

      - name: Install admin deps
        working-directory: admin-pc
        run: |
          npm ci --include=dev --prefer-online --no-audit --no-fund || (echo "Retry npm ci for admin..." && npm cache verify && npm ci --include=dev --prefer-online --no-audit --no-fund)
          npm ls react-scripts --depth=0
          npm ls typescript --depth=0
          npm ls @types/node --depth=0
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

      - name: Typecheck admin
        working-directory: admin-pc
        run: npm run typecheck
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"

      - name: Build admin
        working-directory: admin-pc
        run: CI= npm run build
        env:
          NPM_CONFIG_PRODUCTION: "false"
          NPM_CONFIG_INCLUDE: "dev"
          NPM_CONFIG_OMIT: "optional"
